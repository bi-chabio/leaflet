<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바이오인슈어런스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --mist:#EEF3F8; --ink:#14233A; --ink-soft:#4A5B73; --line:#D6E0EB;
  --blue:#1D4F9C; --blue-deep:#163E7C; --on-blue:#FFFFFF; --teal:#2F9B98; --teal-soft:#E3F3F2;
  --serif:"Noto Serif KR","Noto Serif JP","Noto Serif SC","Songti SC","Hiragino Mincho ProN",serif;
  --sans:"Noto Sans KR","Noto Sans","Noto Sans JP","Noto Sans SC","Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1828; --mist:#172338; --ink:#E9EFF7; --ink-soft:#A9B7CB; --line:#2A3A55;
    --blue:#2C63B8; --blue-deep:#1E4A8E; --on-blue:#FFFFFF; --teal:#5CC4C0; --teal-soft:#183635;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1828; --mist:#172338; --ink:#E9EFF7; --ink-soft:#A9B7CB; --line:#2A3A55;
  --blue:#2C63B8; --blue-deep:#1E4A8E; --on-blue:#FFFFFF; --teal:#5CC4C0; --teal-soft:#183635;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
:lang(ja) body,body:lang(ja){font-family:"Noto Sans JP",var(--sans)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding:0 22px}

header.top{padding:22px 0 6px;display:flex;align-items:center;gap:12px}
.sym{display:block;height:24px;width:auto;flex:none}
.mark{width:34px;height:34px;flex:none}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--ink-soft);letter-spacing:.02em}

.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 0}
.langs button{min-height:52px;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;font-size:17px;font-weight:500;cursor:pointer;padding:6px 4px}
.langs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}

.hello{position:relative;padding:44px 0 34px;overflow:hidden}
.hello svg.rings{position:absolute;right:-70px;top:6px;width:240px;height:240px;color:var(--teal);opacity:.22;pointer-events:none}
.hello h1{position:relative;font-family:var(--serif);font-weight:600;font-size:clamp(30px,8.4vw,42px);line-height:1.32;letter-spacing:-.015em;margin:0;text-wrap:balance}
.hello p{position:relative;margin:16px 0 0;color:var(--ink-soft);font-size:18px;max-width:30em}
.hello p.about{color:var(--ink);font-size:18px;line-height:1.7;margin-top:20px;padding-left:16px;border-left:3px solid var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .hello svg.rings g{transform-origin:120px 120px;animation:breathe 9s ease-in-out infinite}
  .hello svg.rings .core{transform-origin:120px 120px;animation:core 9s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.05) rotate(10deg)}}
  @keyframes core{50%{transform:scale(1.18)}}
}

h2{font-size:15px;font-weight:700;color:var(--teal);margin:0 0 14px;letter-spacing:.01em}
section.leaflets{padding:6px 0 30px}
.leaf{display:flex;gap:18px;align-items:stretch;padding:16px;border-radius:20px;background:var(--mist);margin-bottom:14px}
.leaf .cover{flex:none;width:96px;aspect-ratio:3/5;border-radius:10px;overflow:hidden;background:var(--blue)}
.leaf .cover img{width:100%;height:100%;object-fit:cover;display:block}
.leaf .body{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.leaf h3{margin:0 0 12px;font-size:21px;line-height:1.35;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--blue);color:var(--on-blue);font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;align-self:flex-start}
.leaf .btn{white-space:nowrap;padding:0 18px;font-size:16px}
html:lang(ko) .hello h1,html:lang(ko) .hello p,html:lang(ko) .brand,html:lang(ko) .leaf h3,html:lang(ko) .soon-note{word-break:keep-all}
.btn:active{background:var(--blue-deep)}
.leaf.soon .cover img{filter:grayscale(1);opacity:.45}
.soon-note{margin:0;color:var(--ink-soft);font-size:16px;line-height:1.5}
.alts{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;color:var(--ink-soft)}
.alts button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;min-height:40px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}

section.consult{background:var(--blue);color:var(--on-blue);border-radius:24px;padding:26px 22px 24px;margin:4px 0 30px}
section.consult h2{color:#BFE6E4}
.center{font-size:17px;opacity:.9;margin:0}
.note{display:inline-block;margin-top:6px;font-size:14px;background:rgba(255,255,255,.14);padding:2px 10px;border-radius:999px}
.num{display:block;white-space:nowrap;font-size:clamp(25px,7vw,34px);font-weight:700;letter-spacing:.01em;margin:14px 0 18px;text-decoration:none;font-variant-numeric:tabular-nums}
.call{width:100%;background:var(--on-blue);color:#163E7C;font-size:19px;min-height:58px}
.call:active{background:#E6EEF8}
.call svg{width:22px;height:22px}
.extra{margin:16px 0 0;font-size:15px;opacity:.92;line-height:1.55}
.extra a{color:inherit}
.hours{margin:10px 0 0;font-size:15px;opacity:.88}

footer{padding:6px 0 36px;color:var(--ink-soft);font-size:14px;text-align:center}

/* viewer */
.scrim{position:fixed;inset:0;z-index:19;background:rgba(8,18,34,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.viewer{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:20;background:var(--paper);display:flex;flex-direction:column;border-radius:24px 24px 0 0;box-shadow:0 -24px 60px -20px rgba(8,18,34,.45);overflow:hidden;transform:translateY(104%);visibility:hidden;transition:transform .6s var(--ease),visibility 0s linear .6s}
.viewer.open{transform:none;visibility:visible;transition:transform .6s var(--ease),visibility 0s}
.viewer::before{content:"";position:absolute;top:8px;left:50%;width:42px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.vbar{display:flex;align-items:center;gap:12px;padding:22px 16px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.vbar h3{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:16px;font-weight:700;cursor:pointer}
.vscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.hint{margin:0 16px 14px;font-size:15px;color:var(--ink-soft);background:var(--teal-soft);border-radius:12px;padding:10px 14px}
.page{margin:0 0 22px}
.page .plabel{font-size:14px;font-weight:700;color:var(--teal);margin:0 16px 6px}
.pscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pscroll{background:var(--mist);min-height:120px}
.pscroll img{display:block;width:100%;height:auto;cursor:zoom-in;transition:width .25s ease}
.pscroll.zoomed img{width:260%;max-width:none;cursor:zoom-out}
@media (min-width:900px){.pscroll img{max-width:1400px;margin:0 auto}.pscroll.zoomed img{width:200%;max-width:none}}
@media (prefers-reduced-motion:reduce){.pscroll img{transition:none}}
body.locked{overflow:hidden}

/* ===== motion & finish ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.36,.5,1)}
.langs{position:relative}
.langs .pill{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;background:linear-gradient(135deg,var(--blue) 0%,#0A6FC2 100%);box-shadow:0 10px 22px -10px rgba(29,79,156,.65);z-index:0;pointer-events:none;opacity:0}
.langs .pill.ready{opacity:1;transition:transform .55s var(--spring),width .55s var(--spring),height .55s var(--spring)}
.langs button{position:relative;z-index:1;transition:color .35s var(--ease),border-color .35s var(--ease),background-color .35s var(--ease),transform .2s var(--ease)}
.langs button[aria-pressed="true"]{background:transparent;border-color:transparent;color:var(--on-blue)}
.langs button:active{transform:scale(.95)}
.btn{transition:transform .2s var(--ease),background-color .25s var(--ease),box-shadow .35s var(--ease)}
.btn:active{transform:scale(.96)}
.leaf{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.leaf .cover{box-shadow:0 8px 18px -10px rgba(20,35,58,.5)}
.leaf .cover img{transition:transform 1s var(--ease)}
.leaf:active{transform:scale(.985)}
@media (hover:hover){
  .leaf:hover{transform:translateY(-4px);box-shadow:0 22px 44px -26px rgba(20,35,58,.5)}
  .leaf:hover .cover img{transform:scale(1.07)}
  .btn:hover{box-shadow:0 12px 26px -12px rgba(29,79,156,.75)}
  .langs button[aria-pressed="false"]:hover{border-color:var(--blue)}
  .close:hover{border-color:var(--ink-soft)}
}
section.consult{position:relative;overflow:hidden;box-shadow:0 24px 50px -30px rgba(22,62,124,.8)}
section.consult::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.06);pointer-events:none}
.call{position:relative;overflow:hidden}
.call::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(29,79,156,.16) 50%,transparent 70%);transform:translateX(-110%)}
.consult.seen .call::after{animation:shine 1.6s var(--ease) .35s 2}
.consult.seen .call svg{animation:ring 1.3s ease-in-out .5s 2}
@keyframes shine{to{transform:translateX(110%)}}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.pscroll img{opacity:0;transition:opacity .5s var(--ease),width .3s var(--ease)}
.pscroll img.loaded{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

const $ = id => document.getElementById(id);
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.22,1,.36,1)";
const has = (kind,lang) => !!IMG[`${kind}_${lang}_1`];
const pages = (kind,lang) => { const a=[]; for(let i=1;IMG[`${kind}_${lang}_${i}`];i++) a.push(IMG[`${kind}_${lang}_${i}`]); return a; };
const thumb = (kind,lang) => IMG[`thumb_${kind}_${lang}`];
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function detect(){
  const saved = LS.get("bi-lang"); if (saved && T[saved]) return saved;
  for (const l of (navigator.languages||[navigator.language||"ko"])) { const p=(l||"").slice(0,2).toLowerCase(); if (T[p]) return p; }
  return "ko";
}

let lang = "ko";
let pill = null;

function renderLangs(){
  const nav=$("langs");
  if(!pill){
    pill=document.createElement("span"); pill.className="pill"; nav.appendChild(pill);
    for (const [code,name] of LANGS){
      const b=document.createElement("button"); b.type="button"; b.textContent=name; b.lang=code; b.dataset.code=code;
      b.onclick=()=>{ if(navigator.vibrate) try{navigator.vibrate(8)}catch(e){} location.hash = code; };
      nav.appendChild(b);
    }
  }
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.code===lang ? "true":"false"));
  placePill();
}
function placePill(){
  const b=$("langs").querySelector('button[aria-pressed="true"]'); if(!b||!pill) return;
  pill.style.width=b.offsetWidth+"px"; pill.style.height=b.offsetHeight+"px";
  pill.style.transform=`translate(${b.offsetLeft}px,${b.offsetTop}px)`;
}

function renderLeaflets(){
  const t=T[lang], list=$("leafList"); list.innerHTML="";
  for (const kind of KINDS){
    const ok = has(kind,lang);
    const codes = LANGS.map(x=>x[0]);
    const fallbackLang = ok ? lang : (has(kind,"en") ? "en" : codes.find(l=>has(kind,l)));
    const el=document.createElement("article"); el.className="leaf"+(ok?"":" soon");
    const img = thumb(kind, ok?lang:fallbackLang);
    el.innerHTML = `<div class="cover">${img?`<img alt="" src="${img}">`:""}</div><div class="body"><h3></h3></div>`;
    el.querySelector("h3").textContent = t[kind];
    const body = el.querySelector(".body");
    if (ok){
      const b=document.createElement("button"); b.className="btn"; b.type="button"; b.textContent=t.view;
      b.onclick=()=>{ location.hash = `${lang}-${kind}`; };
      body.appendChild(b);
    } else {
      const p=document.createElement("p"); p.className="soon-note"; p.textContent=t.soon; body.appendChild(p);
      const alts=document.createElement("div"); alts.className="alts";
      const lab=document.createElement("span"); lab.textContent=t.alts; alts.appendChild(lab);
      for (const [code,name] of LANGS){ if(code!==lang && has(kind,code)){ const b=document.createElement("button"); b.type="button"; b.textContent=name; b.lang=code; b.onclick=()=>{ location.hash=`${code}-${kind}`; }; alts.appendChild(b);} }
      body.appendChild(alts);
    }
    list.appendChild(el);
  }
}

function renderContact(){
  const c=CONTACT[lang], t=T[lang];
  $("consultHead").textContent=t.consult;
  $("center").textContent=c.center;
  $("note").hidden=!c.note; $("note").textContent=c.note||"";
  $("num").textContent=c.show; $("num").href="tel:"+c.tel;
  $("call").href="tel:"+c.tel; $("callTxt").textContent=t.call;
  $("hours").hidden=!c.hours; $("hours").textContent=c.hours||"";
  const ex=$("extra");
  if (c.email){ ex.hidden=false; ex.textContent=t.email+" "; const a=document.createElement("a"); a.href="mailto:"+c.email; a.textContent=c.email; ex.appendChild(a); }
  else { ex.hidden=true; ex.textContent=""; }
}

function renderContent(){
  const t=T[lang];
  document.documentElement.lang = lang==="zh" ? "zh-Hans" : lang;
  document.title = lang==="ko" ? "차바이오텍 바이오인슈어런스" : "CHA Biotech Bio Insurance";
  $("greet").textContent=t.greet; $("about").textContent=t.about; $("sub").textContent=t.sub; $("leafHead").textContent=t.leaf;
  renderLeaflets(); renderContact();
}

/* 순차 등장 모션 */
function reveal(els, base=0, step=70){
  if(reduce) return;
  els.forEach((el,i)=>{ if(!el||!el.animate) return;
    el.animate([{opacity:0,transform:"translateY(18px)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0)"}],
      {duration:760,delay:base+i*step,easing:EASE,fill:"backwards"});
  });
}
const contentTargets = () => [$("greet"),$("about"),$("sub"),$("leafHead"),...document.querySelectorAll("#leafList .leaf"),$("consult")];

let swapping=null;
function swapContent(){
  const el=$("content");
  if(reduce||!el.animate){ renderContent(); return; }
  if(swapping){ swapping.cancel(); swapping=null; }
  const a=el.animate([{opacity:1,transform:"none",filter:"blur(0)"},{opacity:0,transform:"translateY(-8px)",filter:"blur(4px)"}],{duration:200,easing:"ease-in",fill:"forwards"});
  swapping=a;
  a.onfinish=()=>{ if(swapping!==a) return; renderContent(); a.cancel(); swapping=null; reveal(contentTargets(),0,60); };
}

function setLang(next){
  if(!T[next] || next===lang) return;
  lang=next; LS.set("bi-lang",lang);
  renderLangs(); swapContent();
}

function openViewer(kind, vlang){
  const t=T[lang], ps=pages(kind,vlang);
  if(!ps.length){ closeViewer(); return; }
  $("vTitle").textContent = T[vlang][kind];
  $("vClose").textContent = t.close; $("vHint").textContent = t.hint;
  const wrap=$("vPages"); wrap.innerHTML="";
  ps.forEach((src,i)=>{
    const d=document.createElement("div"); d.className="page";
    const l=document.createElement("p"); l.className="plabel"; l.textContent = i===0?t.front:(i===1?t.back:String(i+1));
    const s=document.createElement("div"); s.className="pscroll";
    const im=document.createElement("img"); im.alt=T[vlang][kind]+" "+l.textContent;
    im.onload=()=>im.classList.add("loaded"); im.src=src; if(im.complete) im.classList.add("loaded");
    im.onclick=()=>s.classList.toggle("zoomed");
    s.appendChild(im); d.appendChild(l); d.appendChild(s); wrap.appendChild(d);
  });
  $("vScroll").scrollTop=0;
  $("viewer").classList.add("open"); $("scrim").classList.add("open"); document.body.classList.add("locked");
  reveal([$("vHint"),...wrap.children],220,90);
  setTimeout(()=>{ try{$("vClose").focus({preventScroll:true})}catch(e){} },300);
}
function closeViewer(){ $("viewer").classList.remove("open"); $("scrim").classList.remove("open"); document.body.classList.remove("locked"); }

function route(){
  const h=(location.hash||"").replace(/^#/,"");
  const m=h.match(/^(ko|en|zh|ja|ru|vi)(?:-(immune|stem))?$/);
  if(m){
    const target=m[1], kind=m[2];
    if(!kind){ closeViewer(); setLang(target); return; }
    if(!has(kind,target)){ closeViewer(); setLang(target); return; }
    openViewer(kind,target); return;
  }
  closeViewer();
}

function closeAction(){ if(/-(immune|stem)$/.test(location.hash) && history.length>1) history.back(); else { closeViewer(); location.hash=lang; } }
$("vClose").onclick=closeAction;
$("scrim").onclick=closeAction;
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("viewer").classList.contains("open")) closeAction(); });
window.addEventListener("hashchange",route);
window.addEventListener("resize",placePill);

/* 시작 */
lang = detect();
const m0=(location.hash||"").replace(/^#/,"").match(/^(ko|en|zh|ja|ru|vi)/);
if(m0) lang=m0[1];
renderLangs(); renderContent();
requestAnimationFrame(()=>{ placePill(); requestAnimationFrame(()=>pill && pill.classList.add("ready")); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(placePill);
reveal([document.querySelector("header.top"),$("langs"),...contentTargets()],60,80);
route();

/* 상담 영역이 보이면 전화 버튼 강조 */
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("seen"); io.disconnect(); } }),{threshold:.5});
  io.observe($("consult"));
} else { $("consult").classList.add("seen"); }
</script>
